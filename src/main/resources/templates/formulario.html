<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="claro">
<div class="form-card">
    <h1>Formulario de alta</h1>

    <!-- Solo se pinta si existe mensajeError -->
    <div class="error-msg" th:if="${mensajeError}" th:text="${mensajeError}">Mensaje de error por defecto</div>

    <form method="post" th:action="@{/alta}">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" th:value="${nombre}" type="text">

        <label for="email">Email</label>
        <input id="email" name="email" required th:value="${email}" type="email">

        <label for="tecnologia">Tecnología con la que más te gustaria trabajar</label>
        <select id="tecnologia" name="tecnologia">
            <!-- th:each sustituye a <c:forEach>. th:selected mantiene la opción elegida si volvemos con error -->
            <option th:each="t : ${tecnologias}"
                    th:selected="${t == tecnologia}"
                    th:text="${t}"
                    th:value="${t}">Tecnología
            </option>
        </select>

        <label for="nivel">Nivel (puedes marcar varios)</label>
        <select id="nivel" multiple name="nivel">
            <!-- Pista: #lists.contains(lista, elemento) -->
            <option th:each="n : ${listaNiveles}"
                    th:selected="${nivelesSeleccionados != null
                    and #lists.contains(nivelesSeleccionados, n)}"
                    th:text="${n}"
                    th:value="${n}">Nivel
            </option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
